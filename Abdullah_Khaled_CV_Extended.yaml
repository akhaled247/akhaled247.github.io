        highlights:
          - Sorted and shelved donations for Frisco Family Market, which raises funds for underserved local families with financial, medical, and physical needs
          - Sorted and stocked Food Pantry, which also serves underserved local families
      - company: Wolverines Tennis Team, Wakeland High School
        position: Junior Varsity (JV)
        date:
        start_date: 2023-08
        end_date: 2024-08
        location: Frisco, TX
        highlights:
          - Participated in singles and doubles tournaments throughout academic school year
          - Sportsmanship Award Winner 2024
    Honors & Awards:
      - bullet: "(2025) Collegeboard: AP Scholar with Distinction, National Recognition Program: School Recognition Award"
      - bullet: "(2026) OralVision: Conrad Challenge Innovator Award; Diamond Challenge Semifinalist"
