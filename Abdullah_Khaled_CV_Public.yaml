# Web design tokens: keep in sync with _sass/_design-tokens.scss
design:
  theme: engineeringclassic
  page:
    size: us-letter
    top_margin: 0.55in
    bottom_margin: 0.55in
    left_margin: 0.58in
    right_margin: 0.58in
    show_footer: false
    show_top_note: false
  colors:
    body: "#313131"
    name: "#313131"
    headline: "#616161"
    connections: "#1082ac"
    links: "#1aa7f7"
    section_titles: "04416d"
    footer: rgb(128, 128, 128)
  typography:
    line_spacing: 0.48em
  #   alignment: justified
  #   date_and_location_column_alignment: right
    font_family:
      body: 'IBM Plex Sans'
      name: 'Playfair Display'
      headline: 'IBM Plex Sans'
      connections: Georgia
      section_titles: Georgia
    font_size:
      body: 9.25pt
      name: 20pt
      headline: 9pt
      connections: 9pt
      section_titles: 12pt
  #   small_caps:
  #     name: false
  #     headline: false
  #     connections: false
  #     section_titles: false
    bold:
      name: false
      headline: false
      connections: false
      section_titles: true
  links:
    underline: true
    show_external_link_icon: false
  # header:
  #   alignment: center
  #   photo_width: 3.5cm
  #   photo_position: left
  #   photo_space_left: 0.4cm
  #   photo_space_right: 0.4cm
  #   space_below_name: 0.7cm
  #   space_below_headline: 0.7cm
  #   space_below_connections: 0.7cm
  #   connections:
  #     phone_number_format: national
  #     hyperlink: true
  #     show_icons: false
  #     display_urls_instead_of_usernames: true
  #     separator: '|'
  #     space_between_connections: 0.5cm
  # section_titles:
  #   type: with_full_line
  #   line_thickness: 0.5pt
  #   space_above: 0.5cm
  #   space_below: 0.3cm
  sections:
    allow_page_break: true
    space_between_regular_entries: 0.32cm
    space_between_text_based_entries: 0.12cm
    show_time_spans_in: []
  entries:
    date_and_location_width: 4.15cm
    side_space: 0cm
    space_between_columns: 0.1cm
    allow_page_break: false
    short_second_row: false
    summary:
      space_above: 0.06cm
      space_left: 0cm
    highlights:
      bullet: ●
      nested_bullet: ●
      space_left: 0cm
      space_above: 0.05cm
      space_between_items: 0.05cm
      space_between_bullet_and_text: 0.28em
  templates:
    education_entry:
      main_column: |-
        **INSTITUTION**, DEGREE AREA -- LOCATION
        SUMMARY
        HIGHLIGHTS
      degree_column:
      date_and_location_column: DATE
