    Honors & Awards:
      - bullet: "(2026) FIRST® Tech Challenge: FIRST® Leadership Award Semi-Finalist (Team 28931)"
      - bullet: "(2025) FRC 9128: Event Winner (FiT Victoria, 25 teams); Autonomous Award (FiT Plano, 31 teams); Creativity Award (FiT Amarillo, 36 teams)"
      - bullet: "(2026) FTC 33791: Event Winner; Control Award (FiT-North Dallas Semi-Regional, 25 teams); Control Award (FiT-North U-League)"
      - bullet: "(2026) OralVision: Conrad Challenge Innovator Award; Diamond Challenge Semifinalist"
      - bullet: "(2025) FTC 26357: Finalist Alliance Captain (FiT-North McKinney Qualifier, 19 teams)"
      - bullet: "(2025) College Board: AP Scholar with Distinction; National Recognition Program — School Recognition Award"

