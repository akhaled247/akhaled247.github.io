    Extracurricular Activities:
      - company: ITKAN Robotics — FIRST Robotics Competition (FRC 9128)
        position: Programming Lead
        date:
        start_date: 2024-09
        end_date: 2026-02
        location: Plano, TX
        highlights:
          - 'Led robot **Programming** as primary Java/WPILib developer for a ~50-member team: owned ~80% of the codebase (2024-12–2025-06), GitHub workflows, command-based autonomous and teleop'
          - 'Built AprilTag pose estimation + auto-align, swerve odometry fusion, and a field-oriented driver UI; integrated OpenCV + SolvePnP with Kalman fusion; shipped autonomous pathing/targeting (state machines, Bezier, PID)—~50% higher autonomous points/match across 12 matches after vision integration'
          - Designed and fabricated an Onshape camera mount for reliable AprilTag detection across field distances; implemented driver-input buffering, custom motor logging classes (AdvantageScope), and match logging/simulation for limited build-season access
          - '**Mentored** rookie FTC teams 26357 and 28931 (2024–Present); supported ~30 students (6 programmers) through competition, including ~25 hrs/week at peak FTC build season'
          - '**Led** multiple FLL workshops (7 students/session) for refugee students using the **conceived** OARobotics curriculum ([OARobotics](https://akhaled247.github.io/personal/oarobotics/)); students completed block-code autonomous maze navigation by session end'
      - company: ITKAN Robotics — FIRST Robotics Competition (FRC 9128)
        position: Chief Technical Advisor
        date:
        start_date: 2025-07
        end_date: present
        location: Plano, TX
        highlights:
          - '**Lead** software strategy for ITKAN’s multi-team FRC program (~20 programmers, ~100-member organization): delegate work, standardize codebase layout, align autonomy/teleop with mechanical and **Electrical** integration under build-season deadlines'
          - Managed autonomy/teleop reliability (**>90%** target) with layered failsafes; preserved match performance after a near-failure camera disconnect through contingency planning
          - Improved mechanism cycle time (~2 s to <1 s), shooter accuracy (~70% to ~95%), throughput (~10 to ~20 balls/s, lab-measured); completed autonomous routines without error in ~8–10 pre-competition practice runs
          - 'Presented vision and autonomous work to engineers at corporate sponsors **Toyota** and **Texas Instruments**; represented the team at nationwide conferences and community/university showcases (incl. U.S. Senator Chris Van Hollen event)'
          - '**Led** summer FRC programming training (~10 students) from fundamentals through programming a competition robot from scratch; **conceived** and built adaptive training site [Mantik](https://mantik.netlify.app/) (written lessons, code, video); YouTube tutorial playlist; Discord support for peer learning'
          - '**Conceived** a lightweight team task system to coordinate build-season work and reduce downtime between matches; cooperative leadership: adaptive curriculum by student mastery, follow-ups tying lessons to live robot code'
      - company: Wolverine Robotics — Wakeland High School (FTC 33791)
        position: Founder and President
        date:
        start_date: 2024-08
        end_date: present
        location: Frisco, TX
        highlights:
          - 'Founded school FTC program after difficulty finding a school-sponsored FIRST team; **led** club operations and connected members with local FIRST opportunities while teaching Java, CAD, and competition skills'
          - Built competition-ready robot in <2 weeks; UIL State Championship 3rd place; grew membership from 0 to 50+ (year one); ~$6k+ resourcing secured (school, NHS, parents)
          - 'Delivered ~6 workshops (10–15 attendees) and monthly demonstrations; **Outreach**: promoted STEM via school administration presentations and engineering notebook'
      - company: Ma'ruf Dallas Refugee Organization (Project Taleem)
        position: Lead Instructor & Peer Program Coordinator
        date:
        start_date: 2023-09
        end_date: present
        location: Dallas, TX
        highlights:
          - Co-lead tutoring for K–6 refugees (~2 hr/week school year); multilingual, age-banded groups; recruited volunteers from five high schools via robotics networks
          - Measured ~15-point average IXL SmartScore gain (Nov–Feb; n=10); monthly robotics enrichment using OARobotics for inclusive, hands-on STEM access
      - company: Mu Alpha Theta Math Honor Society, Wakeland High School
        position: Vice President
        date:
        start_date: 2024-08
        end_date: present
        location: Frisco, TX
        highlights:
          - '**Led** annual middle school math competition: 100+ participants, 3 schools, 35+ volunteers; expanded Math Lab peer tutoring (>20% member participation)'
      - company: Muslim Student Association (MSA), Wakeland High School
        position: Co-Founder, Secretary
        date:
        start_date: 2024-08
        end_date: present
        location: Frisco, TX
        highlights:
          - Co-founded club; secured sponsor and prayer space; created outreach media for student community building
    Work Experience:
      - company: Gideon Math and Reading Center
        position: Math and Reading Instructor
        date:
        start_date: 2024-06
        end_date: present
        location: Frisco, TX
        highlights:
