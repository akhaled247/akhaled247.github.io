<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style id="critical-css">
  html { background-color: #eeeeee; }
  body {
    margin: 0;
    color: #313131;
    font-family: "IBM Plex Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.5;
    background-color: #eeeeee;
  }
  .page__footer { background-color: #04416d; color: #fff; }
  .layout--home .page__title { display: none !important; }
  .initial-content { opacity: 0; }
  html.css-loaded .initial-content { opacity: 1; }
</style>

<link rel="preload" href="{{ '/assets/css/main.css' | relative_url }}" as="style" fetchpriority="high">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" fetchpriority="high" onload="document.documentElement.classList.add('css-loaded')">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  {% if site.enable_copy_code_button -%}
    window.enable_copy_code_button = true;
  {%- endif %}
  (function () {
    function markCssReady() {
      document.documentElement.classList.add('css-loaded');
    }
    if (document.querySelector('link[href*="main.css"]')?.sheet) {
      markCssReady();
    } else {
      window.addEventListener('load', markCssReady);
      setTimeout(markCssReady, 3000);
    }
  })();
</script>

{% include seo.html %}

{% unless site.atom_feed.hide %}
  <link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ '/feed.xml' | relative_url }}{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">
{% endunless %}

<!-- DNS prefetch / preconnect for external resources -->
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="dns-prefetch" href="https://www.googletagmanager.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://www.googletagmanager.com" crossorigin>

<!-- Preload hero image if specified (improves LCP) -->
{% if page.header.overlay_image %}
  <link rel="preload" href="{{ page.header.overlay_image | relative_url }}" as="image">
{% elsif page.header.image %}
  <link rel="preload" href="{{ page.header.image | relative_url }}" as="image">
{% endif %}

<!-- Font Awesome loaded asynchronously (reduces render-blocking) -->
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css" as="style" crossorigin="anonymous" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css" crossorigin="anonymous"></noscript>

{% if site.head_scripts %}
  {% for script in site.head_scripts %}
    <script src="{{ script | relative_url }}" defer></script>
  {% endfor %}
{% endif %}
